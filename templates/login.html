{% extends "base.html" %}
{% block title %}Đăng nhập — ShopMinhGLN{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md">

    <!-- Card đăng nhập -->
    <div class="bg-white rounded-3xl shadow-xl border border-gray-100 overflow-hidden">

      <!-- Header -->
      <div class="bg-gradient-to-br from-indigo-600 to-purple-600 p-8 text-center text-white">
        <div class="w-16 h-16 bg-white/20 rounded-2xl flex items-center justify-center mx-auto mb-4">
          <i class="fas fa-store text-3xl"></i>
        </div>
        <h1 class="text-2xl font-extrabold">Chào mừng trở lại!</h1>
        <p class="text-indigo-200 text-sm mt-1">Đăng nhập để tiếp tục mua sắm</p>
      </div>

      <!-- Form -->
      <div class="p-8">
        <form method="POST" action="{{ url_for('login') }}" class="space-y-5">

          <!-- Tên đăng nhập -->
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1.5">
              <i class="fas fa-user mr-1 text-indigo-400"></i>Tên đăng nhập
            </label>
            <input type="text" name="username" required autofocus
                   placeholder="Nhập tên đăng nhập..."
                   class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm
                          focus:outline-none focus:ring-2 focus:ring-indigo-500
                          focus:border-transparent transition" />
          </div>

          <!-- Mật khẩu -->
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1.5">
              <i class="fas fa-lock mr-1 text-indigo-400"></i>Mật khẩu
            </label>
            <div class="relative">
              <input type="password" name="password" id="password-input" required
                     placeholder="Nhập mật khẩu..."
                     class="w-full border border-gray-200 rounded-xl px-4 py-3 pr-12 text-sm
                            focus:outline-none focus:ring-2 focus:ring-indigo-500
                            focus:border-transparent transition" />
              <button type="button" onclick="togglePassword()"
                      class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400
                             hover:text-indigo-600 transition">
                <i class="fas fa-eye" id="eye-icon"></i>
              </button>
            </div>
          </div>

          <!-- Nút đăng nhập -->
          <button type="submit"
                  class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98]
                         text-white font-bold py-3.5 rounded-xl transition-all shadow-md
                         flex items-center justify-center gap-2 text-sm mt-2">
            <i class="fas fa-sign-in-alt"></i>
            Đăng nhập
          </button>
        </form>

        <!-- Divider -->
        <div class="relative my-6">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-gray-100"></div>
          </div>
          <div class="relative flex justify-center text-xs text-gray-400">
            <span class="bg-white px-3">Chưa có tài khoản?</span>
          </div>
        </div>

        <a href="{{ url_for('register') }}"
           class="block w-full text-center bg-gray-50 hover:bg-indigo-50 border border-gray-200
                  hover:border-indigo-300 text-gray-700 hover:text-indigo-600 font-semibold
                  py-3 rounded-xl transition text-sm">
          <i class="fas fa-user-plus mr-2"></i>Tạo tài khoản mới
        </a>
      </div>
    </div>

    <!-- Link quay về -->
    <p class="text-center mt-6">
      <a href="{{ url_for('index') }}"
         class="text-gray-500 hover:text-indigo-600 text-sm transition flex items-center justify-center gap-1.5">
        <i class="fas fa-arrow-left"></i> Quay về trang chủ
      </a>
    </p>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function togglePassword() {
  const input = document.getElementById('password-input');
  const icon  = document.getElementById('eye-icon');
  if (input.type === 'password') {
    input.type = 'text';
    icon.className = 'fas fa-eye-slash';
  } else {
    input.type = 'password';
    icon.className = 'fas fa-eye';
  }
}
</script>
{% endblock %}
